<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>clement_mon_piti_snake</title>
    <link rel="icon" type="image/png" href="LOGO.png">

    <style>
        body {
            background-color: #111; /* Fond très sombre */
            color: #fff; /* Texte blanc */
            font-family: 'Courier New', Courier, monospace; /* Police rétro */
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        #game-container {
            display: flex;
            gap: 40px;
            align-items: flex-start;
            margin-top: 20px;
        }

        canvas {
            background-color: #000;
            border: 2px solid #fff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .info-panel {
            background-color: #000;
            border: 1px dashed #fff;
            padding: 20px;
            min-width: 200px;
        }

        h2 {
            font-size: 1.2rem;
            border-bottom: 1px solid #fff;
            padding-bottom: 10px;
            margin-top: 0;
        }

        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        li {
            padding: 5px 0;
            border-bottom: 1px dotted #555;
            display: flex;
            justify-content: space-between;
        }

        #current-score {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <h1>Snake</h1>

    <div id="game-container">
        <!-- Zone de jeu -->
        <div>
            <div id="current-score">Score: <span id="score">0</span></div>
            <canvas id="gameCanvas" width="400" height="400"></canvas>
        </div>

        <!-- Panneau des scores -->
        <div class="info-panel">
            <h2>Historique</h2>
            <ul id="score-list">
                <!-- Les scores seront injectés ici par JavaScript -->
            </ul>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Paramètres du jeu
        const gridSize = 20;
        let snake = [{ x: 200, y: 200 }];
        let dx = 20; // Vitesse horizontale
        let dy = 0;  // Vitesse verticale
        let foodX;
        let foodY;
        let score = 0;
        let gameInterval;

        // Écouteur pour les touches du clavier
        document.addEventListener("keydown", changeDirection);

        // Lancement initial
        initGame();

        function initGame() {
            snake = [{ x: 200, y: 200 }];
            dx = 20;
            dy = 0;
            score = 0;
            document.getElementById("score").innerText = score;
            generateFood();
            displayScores();
            
            // Boucle principale (100 millisecondes)
            clearInterval(gameInterval);
            gameInterval = setInterval(main, 100);
        }

        function main() {
            if (hasGameEnded()) {
                clearInterval(gameInterval);
                saveScore(score);
                alert("Game Over! Votre score est de " + score + ". Cliquez sur OK pour recommencer.");
                initGame();
                return;
            }

            clearCanvas();
            drawFood();
            advanceSnake();
            drawSnake();
        }

        function clearCanvas() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                ctx.fillStyle = "white";
                ctx.strokeStyle = "black";
                ctx.fillRect(part.x, part.y, gridSize, gridSize);
                ctx.strokeRect(part.x, part.y, gridSize, gridSize);
            });
        }

        function advanceSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head); // Ajoute la nouvelle tête

            const hasEatenFood = head.x === foodX && head.y === foodY;
            if (hasEatenFood) {
                score += 10;
                document.getElementById("score").innerText = score;
                generateFood();
            } else {
                snake.pop(); // Retire la queue si on n'a pas mangé
            }
        }

        function drawFood() {
            ctx.fillStyle = "white";
            ctx.strokeStyle = "black";
            // On dessine la nourriture légèrement plus petite pour la différencier
            ctx.fillRect(foodX + 2, foodY + 2, gridSize - 4, gridSize - 4);
        }

        function randomTen(min, max) {
            return Math.round((Math.random() * (max - min) + min) / gridSize) * gridSize;
        }

        function generateFood() {
            foodX = randomTen(0, canvas.width - gridSize);
            foodY = randomTen(0, canvas.height - gridSize);
            
            // Vérifie que la nourriture n'apparait pas sur le serpent
            snake.forEach(function isFoodOnSnake(part) {
                const foodIsOnSnake = part.x == foodX && part.y == foodY;
                if (foodIsOnSnake) generateFood();
            });
        }

        function changeDirection(event) {
            const LEFT_KEY = 37, RIGHT_KEY = 39, UP_KEY = 38, DOWN_KEY = 40;
            const keyPressed = event.keyCode;
            
            // Empêche le défilement de la page avec les flèches
            if ([37, 38, 39, 40].indexOf(keyPressed) > -1) {
                event.preventDefault();
            }

            const goingUp = dy === -gridSize;
            const goingDown = dy === gridSize;
            const goingRight = dx === gridSize;
            const goingLeft = dx === -gridSize;

            if (keyPressed === LEFT_KEY && !goingRight) { dx = -gridSize; dy = 0; }
            if (keyPressed === UP_KEY && !goingDown) { dx = 0; dy = -gridSize; }
            if (keyPressed === RIGHT_KEY && !goingLeft) { dx = gridSize; dy = 0; }
            if (keyPressed === DOWN_KEY && !goingUp) { dx = 0; dy = gridSize; }
        }

        function hasGameEnded() {
            // Collision avec soi-même
            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            }
            // Collision avec les murs
            const hitLeftWall = snake[0].x < 0;
            const hitRightWall = snake[0].x >= canvas.width;
            const hitTopWall = snake[0].y < 0;
            const hitBottomWall = snake[0].y >= canvas.height;

            return hitLeftWall || hitRightWall || hitTopWall || hitBottomWall;
        }

        // --- GESTION DU STOCKAGE LOCAL (LocalStorage) ---

        function saveScore(newScore) {
            // On ne sauvegarde que les scores > 0
            if (newScore === 0) return;

            // Récupère les scores existants ou crée un tableau vide
            let scores = JSON.parse(localStorage.getItem('snakeScores')) || [];
            
            // Ajoute le nouveau score avec la date actuelle
            const date = new Date().toLocaleDateString('fr-FR', {
                hour: '2-digit',
                minute: '2-digit'
            });
            
            scores.push({ score: newScore, date: date });
            
            // Trie les scores du plus grand au plus petit
            scores.sort((a, b) => b.score - a.score);
            
            // Ne conserve que les 10 meilleurs
            scores = scores.slice(0, 10);
            
            // Sauvegarde dans le navigateur
            localStorage.setItem('snakeScores', JSON.stringify(scores));
        }

        function displayScores() {
            const list = document.getElementById("score-list");
            list.innerHTML = ""; // Vide la liste

            const scores = JSON.parse(localStorage.getItem('snakeScores')) || [];
            
            if (scores.length === 0) {
                list.innerHTML = "<li>Aucun score</li>";
                return;
            }

            scores.forEach((entry, index) => {
                const li = document.createElement("li");
                
                const rankSpan = document.createElement("span");
                rankSpan.innerText = `#${index + 1}`;
                
                const scoreSpan = document.createElement("span");
                scoreSpan.innerText = `${entry.score} pts`;
                
                li.appendChild(rankSpan);
                li.appendChild(scoreSpan);
                list.appendChild(li);
            });
        }
    </script>
</body>
</html>
