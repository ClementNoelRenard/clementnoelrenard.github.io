<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Snake — Clément Noël</title>
    <meta name="description" content="Le Snake de l'atelier de Clément Noël, jouable au clavier et au tactile.">
    <meta name="theme-color" content="#0b0b0a">
    <link rel="icon" type="image/png" href="images/LOGO.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Big+Shoulders+Stencil+Display:wght@800;900&family=JetBrains+Mono:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="style.css">

    <script>document.documentElement.classList.add("js");</script>
    <script src="js/donnees.js" defer></script>
    <script src="js/composants.js" defer></script>
    <script src="js/snake.js" defer></script>
</head>

<body data-page="atelier">
<a class="lien-evitement" href="#contenu">Aller au contenu</a>

<header id="en-tete"></header>

<main id="contenu">

    <!-- ========== EN-TÊTE DE PAGE ========== -->
    <section class="page-entete conteneur">
        <p class="page-entete__fil etiquette-mono">
            <a href="index.html">Accueil</a><span aria-hidden="true">/</span>
            <a href="loisir.html">Atelier</a><span aria-hidden="true">/</span><span>Snake</span>
        </p>
        <h1 class="page-entete__titre apparition" data-decodage>Snake</h1>
    </section>
    <div class="hachures" aria-hidden="true"></div>

    <!-- ========== JEU (js/snake.js) ========== -->
    <section class="section conteneur" aria-label="Jeu">
        <div class="jeu">
            <div>
                <div class="jeu__cadre">
                    <canvas id="jeu-canvas" class="jeu__canvas" role="img" aria-label="Plateau du jeu Snake"></canvas>
                    <div id="jeu-calque" class="jeu__calque">
                        <h2 id="jeu-calque-titre" class="jeu__calque-titre">Prêt</h2>
                        <p id="jeu-calque-texte" class="jeu__calque-texte">Espace, une flèche ou le bouton pour démarrer</p>
                        <button id="jeu-demarrer" class="bouton bouton--plein" type="button">Démarrer</button>
                    </div>
                </div>

                <!-- Croix directionnelle (écrans tactiles) -->
                <div class="croix" role="group" aria-label="Commandes de direction">
                    <button class="croix__haut"   type="button" data-direction="haut"   aria-label="Haut">▲</button>
                    <button class="croix__gauche" type="button" data-direction="gauche" aria-label="Gauche">◀</button>
                    <button class="croix__bas"    type="button" data-direction="bas"    aria-label="Bas">▼</button>
                    <button class="croix__droite" type="button" data-direction="droite" aria-label="Droite">▶</button>
                </div>
            </div>

            <aside class="jeu__panneau" aria-label="Scores et commandes">
                <div class="jeu__bloc">
                    <p class="etiquette-mono">Score</p>
                    <span class="afficheur__ecran">
                        <span class="afficheur__fantome" aria-hidden="true">8888</span>
                        <span id="jeu-score" aria-live="polite">0000</span>
                    </span>
                </div>
                <div class="jeu__bloc">
                    <h2>Meilleurs scores</h2>
                    <ol id="jeu-scores" class="jeu__scores"></ol>
                </div>
                <div class="jeu__bloc">
                    <h2>Commandes</h2>
                    <p class="jeu__touches">
                        <kbd>←</kbd> <kbd>↑</kbd> <kbd>→</kbd> <kbd>↓</kbd> ou <kbd>Z</kbd><kbd>Q</kbd><kbd>S</kbd><kbd>D</kbd> : diriger<br>
                        <kbd>Espace</kbd> ou <kbd>P</kbd> : pause<br>
                        Tactile : glisser sur le plateau
                    </p>
                </div>
            </aside>
        </div>
    </section>

</main>

<footer id="pied-de-page"></footer>
</body>
</html>
